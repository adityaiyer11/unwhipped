    fa() { state.showFA = !state.showFA; render(); },
    read(i) { state.reading = state.reading === Number(i) ? null : Number(i); render(); },
    stance() { const f = current(); state.draft = Object.assign({ value: null, because: "", landed: null }, state.stances[f.id] || {}); state.view = "stance"; render(); },
    pick(v) { state.draft.value = Number(v); render(); },
    landed(w) { state.draft.landed = w; render(); },
    saveStance() {
      const f = current(); if (state.draft.value === null) return;
      const because = (document.getElementById("because") || {}).value || "";
      state.stances[f.id] = { value: state.draft.value, because: because.trim(), landed: state.draft.landed, at: Date.now() };
      save(K.stances, state.stances); state.portrait = null; save(K.portrait, null);
      actions.next();
    },
    skip() { actions.next(); },
    next() { state.showFA = false; state.reading = null; if (state.idx < state.fights.length - 1) { state.idx++; state.view = "fight"; } else { state.view = "profile"; } render(); },
    profile() { state.view = "profile"; render(); },
    home() { if (state.ctl) state.ctl.abort(); state.view = "deck"; state.reading = null; state.lstack = []; render(); },
    learn() { const f = current(); state.lstack = []; state.view = "learn"; seedLearn(f); render(); loadLearn(f, []); },
    six() { state.view = "six"; render(); },
    volley(k) { const f = current(); const [idx, who] = String(k).split(":"); state.volleys[f.id] = Object.assign({}, state.volleys[f.id] || {}, { [idx]: who }); save(K.volleys, state.volleys); render(); },
    area(a) { if (state.lstack.length >= 3) return; const f = current(); state.lstack = state.lstack.concat([a]); render(); loadLearn(f, state.lstack); },
    lback() { if (state.ctl) state.ctl.abort(); if (state.lstack.length) { state.lstack = state.lstack.slice(0, -1); } else { state.view = "fight"; } render(); },
    relearn() { const f = current(); if (state.learn[f.id]) delete state.learn[f.id][learnKey(state.lstack)]; loadLearn(f, state.lstack); },
    portrait() { writePortrait(); },
    regen() { state.fights = null; state.stances = {}; state.portrait = null; save(K.fights, null); save(K.stances, {}); save(K.portrait, null); state.view = "deck"; render(); generate(true); },
    retry() { generate(false); },
    clearStances() { state.stances = {}; state.portrait = null; save(K.stances, {}); save(K.portrait, null); state.view = "deck"; render(); },
  };

  // ---------- rendering ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const svg = {
    back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>',
    arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>',
    check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>',
    ext: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"></path></svg>',
    down: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>',
    home: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h5v-6h4v6h5V10"></path></svg>',
    user: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>',
    chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>',
  };
  // Top bar: [home or back] [title] [profile]. Home is always one tap away.
  function nav(title, back) {
    const home = `<button class="back" data-action="home" aria-label="Home" ${back ? 'style="padding:0 8px"' : ""}>${svg.home}${back ? "" : "<span>Home</span>"}</button>`;
    const left = back ? `<div style="display:flex; align-items:center; gap:2px">${home}<button class="back" data-action="${back.action}" ${back.i !== undefined ? `data-i="${back.i}"` : ""}>${svg.back}<span>${esc(back.label)}</span></button></div>` : home;
    const right = `<button class="back" data-action="profile" aria-label="Your politics" style="gap:6px">${svg.user}<span style="display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:var(--cream); color:var(--green); font-size:12px; font-weight:700;">${takenCount()}</span></button>`;
    return `<div class="top">${left}<div class="mid">${title}</div>${right}</div>`;
  }
  const dots = (n) => `<span class="dots">${[0, 1, 2].map((k) => `<i class="${k < Math.min(3, n) ? "on" : ""}"></i>`).join("")}</span>`;
  // People: official Parliament portraits (CC BY 3.0) and current posts, embedded at build time.
  const person = (name) => PEOPLE[name] || null;
  const roleOf = (name) => { const p = person(name); if (!p) return ""; return p.role || (p.constituency ? "MP for " + p.constituency : ""); };
  const initials = (name) => String(name || "").split(" ").filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  function avatar(name, party, size) {
    const p = person(name); const ring = partyColor(party);
    if (p && p.photo) return `<img class="ava" alt="" src="data:image/jpeg;base64,${p.photo}" style="width:${size}px; height:${size}px; box-shadow: 0 0 0 2px ${ring}">`;
    return `<span class="ava init" style="width:${size}px; height:${size}px; box-shadow: 0 0 0 2px ${ring}; font-size:${Math.round(size * 0.36)}px">${esc(initials(name))}</span>`;
  }
  const ghost = (name) => { const p = person(name); return p && p.photo ? `<img class="ghost" alt="" src="data:image/jpeg;base64,${p.photo}">` : ""; };
  const faces = (f) => {
    const a = f.sides.a, b = f.sides.b;
    const bReal = b.party !== null;
    return `<div class="faces"><div class="stack">${avatar(a.speaker, a.party, 40)}${bReal ? avatar(b.speaker, b.party, 40) : ""}</div>
      <div class="who"><b>${esc(a.speaker)}${bReal ? ` v ${esc(b.speaker)}` : ""}</b><small>${esc(roleOf(a.speaker) || shortParty(a.party))}${bReal ? ` · ${esc(roleOf(b.speaker) || shortParty(b.party))}` : ""}</small></div></div>`;
  };
  const sec = (ms) => (ms / 1000).toFixed(1) + " s";
  const takenCount = () => stanceList().length;

  function protoBar() {
    return `<div class="proto">
      <div><b>Unwhipped</b> · ${S.length} contributions from <b>${esc(shortDate)}</b>${state.sampleStatus === "loading" ? " · connecting to Claude" : state.sampleStatus === "missing" ? " · written portraits need Claude" : state.genMs ? ` · fights picked in ${sec(state.genMs)}` : ""}</div>
      <div style="display:flex; gap:4px;">${state.prebuilt ? "" : `<button data-action="regen" title="Throw the fights away and pick them again">Re-pick</button>`}<button data-action="clearStances">Reset me</button></div>
    </div>`;
  }
  const errorBox = () => state.error ? `<div class="status err">${esc(state.error)} <button data-action="retry" style="font-weight:700; margin-left:6px; text-decoration:underline;">Try again</button></div>` : "";

  function deckView() {
    const f = state.fights;
    const rows = f ? f.map((x, i) => {
      const st = state.stances[x.id];
      return `<button class="rowbtn ${st ? "taken" : ""}" data-action="openFight" data-i="${i}">
        <span class="n">${i + 1}</span>
        <span class="t"><b>${esc(x.title)}</b><small><span class="mark" style="background:${partyColor(x.sides.a.party)}"></span>${esc(x.sides.a.speaker.split(" ").pop())} (${esc(shortParty(x.sides.a.party))})${x.kind === "friendly" ? " · Friendly" : ` v ${esc(pmName.split(" ").pop())}`}${x.kind === "six" ? " · The Six" : x.kind === "agreed" ? " · Agreed" : ""}${st ? " · stance taken" : ""}</small></span>
        ${dots(x.rowdy)}
      </button>`;
    }).join("") : [0, 1, 2, 3, 4].map((i) => `<div class="rowbtn" style="cursor:default"><span class="n">${i + 1}</span><span class="t skel"><i></i><i></i></span></div>`).join("");
    const status = state.genStatus === "busy" ? `<div class="status"><b>Working.</b> ${esc(state.genMsg)}</div>` : (!f && state.sampleStatus === "ready" && state.genStatus === "idle") ? `<div class="status">Ready to pick the fights.</div>` : (!f && state.sampleStatus === "missing") ? `<div class="status err">Claude is not available on this page, so the fights cannot be generated here.</div>` : "";
    return `
      ${nav("Unwhipped", null).replace('data-action="home"', 'data-action="home" style="visibility:hidden"')}
      <div class="hero">
        <div class="date">${esc(dateLabel)} · Prime Minister’s Questions</div>
        <h1>${f ? (state.prebuilt ? `${["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty"][f.length] || f.length} exchanges` : "Five fights") : "Picking the fights"}</h1>
        <p>${f ? (state.prebuilt ? `${esc(loto.split(" ").pop())}’s six, ${f.filter((x) => x.kind === "fight").length} fights, ${f.filter((x) => x.kind === "agreed").length} where the PM agreed, ${f.filter((x) => x.kind === "friendly").length} friendly. Every quote checked against Hansard.` : `${esc(loto.split(" ").pop())}’s six, then four from the benches. Every quote is checked against Hansard.`) : `${esc(loto)} asked ${lotoIdx.length} questions; ${pairs.length} backbench exchanges to choose from.`}</p>
      </div>
      ${status}${errorBox()}
      <div class="rows">${rows}</div>
      <div class="note" style="display:flex; justify-content:space-between;"><span>${S.length} contributions · ${PMQ.counts.interruptions} interruptions · Hansard</span><span>Red dots: rowdiness</span></div>
      <div class="spacer"></div>
      <div class="bar-cta"><button class="cta cream" data-action="start" ${f ? "" : "disabled"}><span>Start the deck</span>${svg.arrow}</button></div>`;
  }

  function friendlyView(f, n) {
    const qu = f.quotes[0]; const s = qu ? S[qu.i] : null; const qs = S[f.speechIdx[0]];
    return `
      ${nav(`${n} of ${state.fights.length}`, null)}
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between;"><span class="eyebrow" style="color:var(--muted)">Friendly question · ${esc(qs.name.split(" ").pop())} (${esc(shortParty(qs.party))})</span><span style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--muted)">${dots(f.rowdy)}<span>${f.rowdy ? "Rowdy" : "Calm"}</span></span></div>
        <h1 style="font-size:22px">${esc(f.title)}</h1>
        <p class="summary">${esc(f.summary)}</p>
        ${s ? `<div class="quotes"><div class="quote"><div class="bar" style="background:${partyColor(s.party)}"></div><div><p>“${esc(qu.text)}”</p><small><b>${esc(s.name)}</b> · ${esc(shortParty(s.party))}${qu.exact ? "" : ' · <span class="flag">not an exact quote</span>'}</small></div></div></div>` : ""}
        <div class="actions"><button class="btn line" data-action="read" data-i="${f.speechIdx[0]}">Read the question</button><a class="btn link" href="${esc(qs.url)}" target="_blank" rel="noopener">Hansard ${svg.ext}</a></div>
      </div>
      ${state.reading !== null && S[state.reading] ? `<div class="modal"><div class="who"><span class="mark" style="background:${partyColor(S[state.reading].party)}"></span>${esc(S[state.reading].name)} · contribution ${state.reading}</div><p>${esc(S[state.reading].text)}</p>${S[state.reading + 1] && S[state.reading + 1].name === pmName ? `<div class="who" style="margin-top:6px"><span class="mark" style="background:${partyColor(pmParty)}"></span>${esc(pmName)}</div><p>${esc(S[state.reading + 1].text)}</p>` : ""}</div>` : ""}
      <div class="decided"><span class="eyebrow">Why no stance</span><p>A question from the PM's own side that invites agreement. It is in the deck because it happened, and it counts towards how much of PMQs is friendly.</p></div>
      <div class="spacer"></div>
      <div class="bar-cta"><button class="cta cream" data-action="next"><span>Next</span>${svg.arrow}</button></div>`;
  }

  function fightView() {
    const f = current(); const n = state.idx + 1;
    if (f.kind === "friendly") return friendlyView(f, n);
    const q = (k) => { const qu = f.quotes[k]; if (!qu) return ""; const s = S[qu.i];
      return `<div class="quote"><div class="bar" style="background:${partyColor(s.party)}"></div><div><p>“${esc(qu.text)}”</p><small><b>${esc(s.name)}</b> · ${esc(roleOf(s.name) || shortParty(s.party))}${qu.exact ? "" : ' · <span class="flag">not an exact quote</span>'}</small></div></div>`; };
    const frameLabel = (k) => f.frame ? f.frame[k] : (k === "a" ? "The case for" : "The case against");
    const side = (k, label) => { const sd = f.sides[k];
      if (sd.party === null) return `<div class="side"><div class="head"><span class="mark" style="background:${partyColor(null)}; margin:0"></span><span class="eyebrow">${esc(label)}</span><small>nobody argued this in the chamber</small></div><div class="pt" style="cursor:default"><b style="color:var(--muted)">–</b><span>${esc(sd.label)}. The PM agreed with the questioner, so the other side of this stance was not put by anyone.</span></div></div>`;
      return `<div class="side"><div class="head">${avatar(sd.speaker, sd.party, 22)}<span class="eyebrow">${esc(label)}</span><small>${esc(roleOf(sd.speaker) || shortParty(sd.party))}</small></div>
        ${sd.points.map((p, j) => `<button class="pt" data-action="read" data-i="${p.i === null ? "" : p.i}"><b style="color:${partyColor(sd.party)}">${j + 1}</b><span>${esc(p.text)}${p.i !== null ? ` <small>[${p.i}]</small>` : ""}</span></button>`).join("")}</div>`; };
    const reading = state.reading !== null && S[state.reading] ? `<div class="modal"><div class="who"><span class="mark" style="background:${partyColor(S[state.reading].party)}"></span>${esc(S[state.reading].name)} · ${esc(shortParty(S[state.reading].party))} · contribution ${state.reading}</div><p>${esc(S[state.reading].text)}</p><a class="btn link" style="margin:0" href="${esc(S[state.reading].url)}" target="_blank" rel="noopener">Open in TheyWorkForYou ${svg.ext}</a></div>` : "";
    return `
      ${nav(`Fight ${n} of ${state.fights.length}`, null)}
      ${errorBox()}
      <div class="card">
        ${ghost(f.sides.a.speaker)}
        <div style="display:flex; align-items:center; justify-content:space-between;"><span class="eyebrow" style="color:var(--muted)">${f.kind === "six" ? "The Six" : f.kind === "agreed" ? "Agreed" : "Fight"} · ${esc(f.theme)}</span><span style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--muted)">${dots(f.rowdy)}<span>${f.rowdy ? "Rowdy" : "Calm"}</span></span></div>
        ${faces(f)}
        <h1>${esc(f.title)}</h1>
        <p class="summary">${esc(f.summary)}</p>
        <div class="quotes">${q(0)}${q(1)}</div>
        ${state.showFA ? `<div class="fa">${side("a", frameLabel("a"))}${side("b", frameLabel("b"))}<small style="font-size:12px; color:var(--muted)">Numbers in brackets are contribution indexes. Tap a point to read that contribution in full.</small></div>` : ""}
        <div class="actions" style="flex-wrap:wrap">${f.volleys ? `<button class="btn dark" data-action="six">The Six</button>` : ""}<button class="btn ${state.showFA ? "line" : (f.volleys ? "line" : "dark")}" data-action="fa">${state.showFA ? "Hide" : "The arguments"} ${svg.down}</button><button class="btn line" data-action="learn">Learn more</button><a class="btn link" href="${esc(S[f.speechIdx[0]] ? S[f.speechIdx[0]].url : "#")}" target="_blank" rel="noopener">Hansard ${svg.ext}</a></div>
      </div>
      ${reading}
      ${f.stance ? `<div class="decided"><span class="eyebrow">What is actually being decided</span><p>${esc(f.decided)}</p></div>` : `<div class="decided"><span class="eyebrow">No stance on this one</span><p>${esc(f.decided || "It is a specific ask rather than a choice between two policies.")} You can still say who you side with more.</p></div>`}
      <div class="spacer"></div>
      <div class="bar-cta"><button class="cta ghost" data-action="skip">Skip</button><button class="cta cream" data-action="stance"><span>${state.stances[f.id] ? (f.stance ? "Change your stance" : "Change your side") : (f.stance ? "Take a stance" : "Who do you side with?")}</span>${svg.arrow}</button></div>`;
  }

  function sideView(f, d) {
    const a = f.sides.a, b = f.sides.b;
    const opt = (k, who, party, label, v) => `<button class="sidebtn ${d.value === v ? "on" : ""}" data-action="pick" data-v="${v}">${avatar(who, party, 44)}<span class="t"><b>${esc(who)}</b><small>${esc(label)}</small></span></button>`;
    return `
      ${nav("Your side", { action: "openFight", label: "Fight", i: state.idx })}
      <div class="stance-head"><h1>Who do you side with more?</h1><p>Not a policy choice this time. Just whose argument you found more convincing.</p></div>
      <div class="card" style="margin-top:14px; gap:10px; background:transparent; box-shadow:none; padding:0 16px; overflow:visible">
        ${opt("a", a.speaker, a.party, frameOf(f, "a") + " · " + a.label, -1)}
        ${opt("b", b.speaker, b.party, frameOf(f, "b") + " · " + b.label, 1)}
        <button class="sidebtn ${d.value === 0 ? "on" : ""}" data-action="pick" data-v="0"><span class="ava init" style="width:44px; height:44px; font-size:14px; box-shadow:0 0 0 2px var(--cream-line-2)">?</span><span class="t"><b>Torn</b><small>Neither convinced you</small></span></button>
        <input id="because" class="because" placeholder="Because… (optional)" value="${esc(d.because || "")}" maxlength="140" style="margin-top:4px">
      </div>
      <div class="spacer"></div>
      <div class="bar-cta"><button class="cta cream" data-action="saveStance" ${d.value === null ? "disabled" : ""}>${svg.check}<span>${state.idx < state.fights.length - 1 ? "Save, next card" : "Save, see your politics"}</span></button></div>`;
  }
  const frameOf = (f, k) => f.frame ? f.frame[k] : (k === "a" ? "The case for" : "The case against");

  function stanceView() {
    const f = current(); const d = state.draft; const a = f.sides.a, b = f.sides.b;
    if (!f.stance) return sideView(f, d);
    const labels = ["Strongly", "Lean", "Torn", "Lean", "Strongly"];
    return `
      ${nav("Your stance", { action: "openFight", label: "Fight", i: state.idx })}
      <div class="stance-head"><h1>Where do you land?</h1><p>Not which side you like. What you would actually do.</p></div>
      <div class="card" style="margin-top:14px; gap:14px">
        <div class="poles">
          <div class="pole">${avatar(a.speaker, a.party, 32)}<p>${esc(a.label)}</p><small>${esc(a.speaker.split(" ").pop())}${roleOf(a.speaker) ? ", " + esc(roleOf(a.speaker)) : ""}</small></div>
          <div class="pole r">${b.party === null ? `<i style="background:${partyColor(null)}"></i>` : avatar(b.speaker, b.party, 32)}<p>${esc(b.label)}</p><small>${b.party === null ? "nobody argued this" : esc(b.speaker.split(" ").pop()) + (roleOf(b.speaker) ? ", " + esc(roleOf(b.speaker)) : "")}</small></div>
        </div>
        <div class="scale">${[-2, -1, 0, 1, 2].map((v) => `<button class="${d.value === v ? "on" : ""}" data-action="pick" data-v="${v}" aria-label="${labels[v + 2]}"></button>`).join("")}</div>
        <div class="scale-l">${labels.map((l, k) => `<span ${d.value === k - 2 ? 'style="color:var(--ink); font-weight:600"' : ""}>${l}</span>`).join("")}</div>
        <input id="because" class="because" placeholder="Because… (optional)" value="${esc(d.because || "")}" maxlength="140">
      </div>
      <div class="landed"><span class="eyebrow">Which of them landed harder?</span><div class="two">
        <button class="${d.landed === "a" ? "on" : ""}" data-action="landed" data-w="a"><span class="mark" style="background:${partyColor(a.party)}; margin:0"></span>${esc(a.speaker.split(" ").pop())}</button>
        <button class="${d.landed === "b" ? "on" : ""}" data-action="landed" data-w="b"><span class="mark" style="background:${partyColor(b.party)}; margin:0"></span>${esc(b.speaker.split(" ").pop())}</button>
      </div></div>
      <div class="spacer"></div>
      <div class="bar-cta"><button class="cta cream" data-action="saveStance" ${d.value === null ? "disabled" : ""}>${svg.check}<span>${state.idx < state.fights.length - 1 ? "Save stance, next fight" : "Save stance, see your politics"}</span></button></div>`;
  }

  function profileView() {
    const taken = stanceList(); const tally = partyTally(); const max = tally.length ? tally[0][1] : 1;
    const portrait = state.portrait && state.portrait.count === taken.length
      ? `<p class="big">${esc(state.portrait.text)}</p><small>Written from your stances only. It changes as you take more.</small>`
      : taken.length && !state.sample ? `<p class="big">${esc(fallbackPortrait())}</p><small>Worked out from your stances. A written portrait needs Claude, which is not available on this device.</small>`
      : taken.length ? `<button class="btn dark" data-action="portrait" ${state.portraitBusy ? "disabled" : ""}>${state.portraitBusy ? "Writing…" : (state.portrait ? "Rewrite my portrait" : "Write my portrait")}</button><small>One sentence, generated from the ${taken.length} stance${taken.length === 1 ? "" : "s"} you have taken.</small>` : `<small>Take a stance on a fight and a one-line portrait appears here.</small>`;
    return `
      ${nav("Your politics", null)}
      ${errorBox()}
      <div class="portrait"><span class="eyebrow">After ${esc(shortDate)} · ${taken.length} stance${taken.length === 1 ? "" : "s"}</span>${portrait}</div>
      ${taken.length ? (() => { const g = govTally(); const l = landedTally(); return `<div class="panel"><span class="eyebrow">How your view is shaping</span>
        <div style="display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--green)"><div style="width:${Math.round(100 * g.withGov / g.total)}%; background:${partyColor(pmParty)}"></div><div style="flex-grow:1; background:var(--pale)"></div></div>
        <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--on-green)"><span>With the Government ${g.withGov}</span><span>Against ${g.against}</span></div>
        <div style="font-size:13px; color:var(--on-green); line-height:1.45">${g.withGov === 0 ? `You have sided against ${esc(pmName.split(" ").pop())} every time so far.` : g.against === 0 ? `You have sided with ${esc(pmName.split(" ").pop())} every time so far.` : `You split ${g.withGov} to ${g.against} between the Government and its critics.`}${l.n ? ` On who landed harder, you gave it to ${esc(l.top[0][0].split(" ").pop())} ${l.top[0][1]} of ${l.n} times.` : ""}${(() => { const vt = volleyTally(); return vt.n ? ` In the Six, you scored ${vt.n} volley${vt.n === 1 ? "" : "s"} and gave ${vt.top[0][1]} to ${esc(vt.top[0][0].split(" ").pop())}.` : ""; })()}</div>
      </div>`; })() : ""}
      <div class="panel"><div style="display:flex; justify-content:space-between; align-items:baseline"><span class="eyebrow">Who you sided with</span><span style="font-size:12px; color:var(--muted-g)">times their MPs argued your side</span></div>
        ${tally.length ? tally.map(([p, n]) => `<div class="prow"><span>${esc(shortParty(p))}</span><div class="track"><i style="width:${Math.round(100 * n / max)}%; background:${partyColor(p)}"></i></div><b>${n}</b></div>`).join("") : `<div style="font-size:13px; color:var(--muted-g)">Nothing yet. Torn counts for neither side.</div>`}
        <small style="font-size:12px; color:var(--muted-g); line-height:1.4">Matched by who argued which side in the chamber, not by manifestos.</small></div>
      <div class="label"><span class="eyebrow">By theme</span></div>
      <div class="chips">${themeLean().length ? themeLean().map((t) => `<span class="chip">${t.party ? `<i style="background:${partyColor(t.party)}"></i>` : ""}${esc(t.theme)}${t.party ? "" : " · torn"}</span>`).join("") : `<span style="font-size:13px; color:var(--muted-g); padding-left:4px">No themes yet.</span>`}</div>
      <div class="label"><span class="eyebrow">Your stances</span></div>
      <div class="list">${taken.map((s) => `<div class="item"><i style="background:${partyColor(s.side.party)}"></i><span>${esc(s.side.label)}${s.because ? `<br><small style="color:var(--muted-g)">“${esc(s.because)}”</small>` : ""}</span><small>${s.strength}</small></div>`).join("")}</div>
      <div class="spacer"></div>
      <div class="bar-cta"><button class="cta ghost" data-action="deck" style="flex-grow:1; justify-content:center">Back to the deck</button></div>`;
  }

  function learnView() {
    const f = current(); const node = learnNode(f, state.lstack) || { text: "", areas: [], streaming: true, depth: state.lstack.length };
    const title = state.lstack.length ? state.lstack[state.lstack.length - 1] : f.title;
    const paras = node.text ? node.text.split(/\n\n+/).map((p) => `<p class="summary" style="font-family:var(--serif); font-size:17px">${esc(p)}</p>`).join("") : `<div class="skel"><i></i><i></i><i></i><i></i></div>`;
    const body = node.error ? `<div class="status err" style="margin:0">${esc(node.error)} <button data-action="relearn" style="font-weight:700; text-decoration:underline; margin-left:6px">Try again</button></div>` : paras;
    const canGo = state.lstack.length < 3;
    const areas = (!node.streaming && node.areas.length)
      ? `<div class="label"><span class="eyebrow">${canGo ? (state.lstack.length ? "Dig further" : "Explore") : "Three levels deep, which is where this stops"}</span></div>
         <div class="rows" style="padding-top:0">${node.areas.map((a) => `<button class="rowbtn" data-action="area" data-i="${esc(a)}" ${canGo ? "" : "disabled style='opacity:.5;cursor:default'"}><span class="t"><b>${esc(a)}</b></span>${svg.chev}</button>`).join("")}</div>`
      : "";
    return `
      ${nav(state.lstack.length ? `Level ${state.lstack.length} of 3` : "Learn more", { action: "lback", label: state.lstack.length ? "Back" : "Fight" })}
      <div class="note" style="padding-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${esc(f.title)}${state.lstack.map((s) => ` › ${esc(s)}`).join("")}</div>
      <div class="card" style="margin-top:8px">
        <span class="eyebrow" style="color:var(--muted)">${state.lstack.length ? "Explainer" : "Background"}</span>
        <h1 style="font-size:22px">${esc(title)}</h1>
        ${body}
        ${!node.streaming && !node.error ? `<small style="font-size:12px; color:var(--muted); line-height:1.4">General knowledge, not Hansard. Check anything you plan to repeat.${node.ms ? ` Written in ${sec(node.ms)}.` : ""}</small>` : ""}
      </div>
      ${areas}
      <div class="spacer"></div>
      <div class="bar-cta"><button class="cta ghost" data-action="openFight" data-i="${state.idx}" style="flex-grow:1; justify-content:center">Back to the fight</button><button class="cta cream" data-action="stance"><span>Take a stance</span>${svg.arrow}</button></div>`;
  }

  function sixView() {
    const f = current(); const v = state.volleys[f.id] || {};
    const rows = f.volleys.map(([qi, ai], k) => { const q = S[qi], a = S[ai];
      return `<div class="card" style="margin-top:${k ? 12 : 10}px; gap:10px">
        <span class="eyebrow" style="color:var(--muted)">Question ${k + 1} of ${f.volleys.length}</span>
        ${ghost(k % 2 ? a.name : q.name)}
        <div class="quote">${avatar(q.name, q.party, 28)}<div><p style="font-size:16px">${esc(q.text)}</p><small><b>${esc(q.name)}</b> · ${esc(roleOf(q.name) || shortParty(q.party))}${q.interruptions ? ` · ${q.interruptions} interruption${q.interruptions > 1 ? "s" : ""}` : ""}${q.laughter ? " · laughter" : ""}</small></div></div>
        <div class="quote">${avatar(a.name, a.party, 28)}<div><p style="font-size:16px">${esc(a.text)}</p><small><b>${esc(a.name)}</b> · ${esc(roleOf(a.name) || shortParty(a.party))}${a.interruptions ? ` · ${a.interruptions} interruption${a.interruptions > 1 ? "s" : ""}` : ""}</small></div></div>
        <div class="landed oncream" style="margin:0"><span class="eyebrow" style="color:var(--muted); padding:0">Which landed harder?</span><div class="two">
          <button class="${v[k] === "a" ? "on" : ""}" data-action="volley" data-i="${k}:a"><span class="mark" style="background:${partyColor(q.party)}; margin:0"></span>${esc(q.name.split(" ").pop())}</button>
          <button class="${v[k] === "b" ? "on" : ""}" data-action="volley" data-i="${k}:b"><span class="mark" style="background:${partyColor(a.party)}; margin:0"></span>${esc(a.name.split(" ").pop())}</button>
        </div></div>
      </div>`; }).join("");
    const scored = Object.keys(v).length;
    return `
      ${nav("The Six", { action: "openFight", label: "Fight", i: state.idx })}
      <div class="note" style="padding-top:8px">${esc(f.sides.a.speaker)} v ${esc(pmName)} · ${scored} of ${f.volleys.length} scored</div>
      ${rows}
      <div class="spacer"></div>
      <div class="bar-cta"><button class="cta ghost" data-action="openFight" data-i="${state.idx}" style="flex-grow:1; justify-content:center">Back to the fight</button><button class="cta cream" data-action="stance"><span>Take a stance</span>${svg.arrow}</button></div>`;
  }

  const app = document.getElementById("app");
  function render() {
    const v = state.view;
    const body = v === "fight" && current() ? fightView() : v === "stance" && current() ? stanceView() : v === "learn" && current() ? learnView() : v === "six" && current() && current().volleys ? sixView() : v === "profile" ? profileView() : deckView();
    app.innerHTML = protoBar() + body;
  }
  app.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-action]"); if (!el || el.disabled) return;
    const fn = actions[el.dataset.action]; if (!fn) return;
    fn(el.dataset.i !== undefined ? el.dataset.i : el.dataset.v !== undefined ? el.dataset.v : el.dataset.w);
  });

  render();
  const useSample = (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample") : Promise.resolve(null);
  useSample.then((sample) => {
    state.sample = sample; state.sampleStatus = sample ? "ready" : "missing"; render();
    if (sample) generate(false);
  });
})();
</script>

</body>
</html>
