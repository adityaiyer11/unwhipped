  const LEARN = {"2026-09-02:1":{"How does early release actually work?":{"text":["Most prison sentences in England and Wales are served partly inside and partly in the community on licence. For years the automatic release point for standard sentences was halfway. In 2024 the Government moved it to 40% for many offenders to free up cells, with a list of offences excluded.","Release on licence is not freedom: the person reports to probation, can be recalled to prison for breaching conditions, and the licence runs to the end of the original sentence. The political fight is over which offences sit on the excluded list and how quickly that list is changed when a case makes the news."],"areas":["What does being on licence involve?","Which offences are excluded from early release?"]},"How does early release actually work? › What does being on licence involve?":{"text":["A released prisoner on licence has conditions: a named probation officer, regular appointments, often a curfew or a ban on contacting particular people or visiting certain areas. Some wear a GPS tag.","Breach a condition, or be arrested for something new, and probation can recall the person to prison without a fresh trial. Recalls have become a large share of the prison population in their own right, which is one reason early release relieves less pressure than it first appears to."],"areas":[]},"How does early release actually work? › Which offences are excluded from early release?":{"text":["Sexual offences, terrorism offences, serious violence attracting four years or more, and offences linked to domestic abuse were kept out of the 2024 scheme from the start. The Prime Minister said in this exchange that rape, grooming and child sex offences were excluded and that death by dangerous driving and manslaughter were being added.","Each addition is popular and each shrinks the number of releases, so ministers face a trade-off between public anger at specific cases and the cell numbers the scheme exists to fix."],"areas":[]},"Why were prisons so full in 2024?":{"text":["The prison population in England and Wales has roughly doubled since the early 1990s, to just under 90,000 by 2024, while building of new prisons fell behind repeated promises. Longer sentences, more people held on remand awaiting trial, and a rising number of recalls all pushed numbers up.","By summer 2024 the system was within a few hundred places of running out, which is why the incoming Government ordered early release within weeks. The alternative, police cells and courts unable to send anyone down, was judged worse."],"areas":["Why are so many people held on remand?","What is being done to build more prison places?"]},"Why were prisons so full in 2024? › Why are so many people held on remand?":{"text":["Remand means being held in prison before or during trial. The Crown Court backlog grew sharply after the pandemic, so people wait longer for trial, and every extra month of waiting is a cell occupied by someone not yet convicted.","Remand prisoners were around a fifth of the population by 2024, the highest share in decades. Clearing the court backlog is therefore a prison policy as much as a justice one."],"areas":[]},"Why were prisons so full in 2024? › What is being done to build more prison places?":{"text":["Governments have promised tens of thousands of new places since 2019, but planning objections, construction costs and the age of the estate mean the net gain has been small. Some new prisons opened; others were delayed for years.","Because building takes a decade and sentences are set now, most experts say capacity alone cannot solve it. Sentencing reform, fewer short sentences and faster courts are the other levers."],"areas":[]},"What sentence does death by dangerous driving carry?":{"text":["Causing death by dangerous driving is an offence under the Road Traffic Act. The maximum sentence was raised from 14 years to life imprisonment in 2022, after long campaigns by bereaved families. Typical sentences are far below the maximum, usually a few years, depending on speed, drink or drugs, and previous record.","Because most sentences are fixed terms rather than life, the release point matters. Halfway versus 40% can be the difference of years for a family, which is why the exclusion Davies raised was so charged."],"areas":["How do judges decide the length?","What is the difference between dangerous and careless driving?"]},"What sentence does death by dangerous driving carry? › How do judges decide the length?":{"text":["Judges follow Sentencing Council guidelines that sort cases by culpability and harm. Racing, gross speed, or driving while impaired put a case in the highest band; a brief lapse in an otherwise careful drive sits lower.","Guilty pleas earn a reduction, and aggravating features such as fleeing the scene add time. The guideline was rewritten after the 2022 change to reflect the higher maximum."],"areas":[]},"What sentence does death by dangerous driving carry? › What is the difference between dangerous and careless driving?":{"text":["Dangerous driving means driving that falls far below what a competent driver would do, and it would be obvious that it was dangerous. Careless driving falls below the standard but not far below.","Causing death by careless driving is a separate, lesser offence with a lower maximum. Which charge is brought often decides the case, and families frequently campaign about that choice as much as the sentence."],"areas":[]}},"2026-09-02:2":{"How is police funding shared out?":{"text":["Each of the 43 forces in England and Wales gets a central government grant set by a formula that weighs population, crime levels, deprivation and other factors, plus what the local police and crime commissioner raises through the police precept on council tax.","The formula has been frozen or fudged since the mid-2010s because changing it creates losers as well as winners. Every review since has been announced and then quietly parked, which is why an MP asking for a specific fix gets pointed to a review."],"areas":["What is the police precept?","Why has the funding formula never been updated?"]},"How is police funding shared out? › What is the police precept?":{"text":["The precept is the slice of council tax that goes to the police, set each year by the police and crime commissioner within a cap set by ministers. Wealthier areas with higher council tax bases raise more from it.","Over the last decade the precept has grown as a share of police budgets, which shifts costs from national taxation to local bills and widens the gap between areas."],"areas":[]},"How is police funding shared out? › Why has the funding formula never been updated?":{"text":["A new formula in 2015 was abandoned after an error in the data was found days before it was due to take effect. Since then successive Home Secretaries have promised a replacement and not delivered one.","The reason is simple arithmetic: any formula that gives more to cities takes it from counties, and the losers have MPs too."],"areas":[]},"Why does London get extra police money?":{"text":["The Metropolitan Police receives a National and International Capital City grant on top of the formula, in recognition of the costs of policing Parliament, embassies, state events and national protests. The City of London force gets a smaller equivalent.","Stevens's argument was that Cardiff has some of the same duties as a capital, hosting the Senedd, national events and major sport, without a matching grant. Edinburgh and Belfast are funded by their own devolved governments, so the comparison is really with London."],"areas":["What does the capital city grant pay for?","Do other capitals get extra?"]},"Why does London get extra police money? › What does the capital city grant pay for?":{"text":["Protection of Parliament and Whitehall, diplomatic premises, royal and state occasions, and the large protests that come to the capital because government is there. It runs to well over a hundred million pounds a year.","The Met has long argued the grant does not cover the true cost; the Home Office has long argued the Met's accounting is generous. Both can be true."],"areas":[]},"Why does London get extra police money? › Do other capitals get extra?":{"text":["Police Scotland and the Police Service of Northern Ireland are funded by their devolved governments, so Edinburgh and Belfast are handled inside those budgets rather than by a Westminster grant.","Cardiff is the odd one out because policing in Wales is not devolved, so South Wales Police is funded like an English force even though the city carries capital duties."],"areas":[]},"What is the police reform programme?":{"text":["Governments of both parties have talked about reforming the structure of policing: fewer, larger forces or shared national services for things like IT, forensics and procurement, plus a revived focus on neighbourhood officers.","Burnham tied the funding question to that programme, which is a way of saying the money will be settled once the shape of policing is settled. Reform programmes take years, so it is also a way of not answering today."],"areas":["Would merging forces save money?","What is neighbourhood policing?"]},"What is the police reform programme? › Would merging forces save money?":{"text":["Mergers were tried in Scotland, which created a single national force in 2013. Costs fell in back-office functions, but local accountability suffered and the transition was expensive and slow.","In England and Wales the last attempt at mergers collapsed in 2006 after local opposition, so ministers now tend to talk about shared services rather than merged forces."],"areas":[]},"What is the police reform programme? › What is neighbourhood policing?":{"text":["Officers and community support officers assigned to a patch, known by name, dealing with antisocial behaviour and low-level crime before it escalates. Numbers fell sharply during the 2010s and both main parties now promise to rebuild them.","Stevens's complaint was that Cardiff's neighbourhood officers keep getting pulled to city-centre events, which is exactly the abstraction that neighbourhood policing is meant to prevent."],"areas":[]}},"2026-09-02:3":{"Why do gilt yields matter to a family's mortgage?":{"text":["Banks fund fixed-rate mortgages by borrowing in wholesale markets at rates that track government bond yields for the same term. If two-year and five-year gilt yields rise, lenders reprice new fixed deals within days, sometimes hours.","Anyone coming off a fixed rate that year faces the new price. That is why a bond market move that sounds abstract turns into hundreds of pounds a month for a household, and why politicians of every party now watch the gilt market like a barometer."],"areas":["What actually moves gilt yields?","How fast does a yield rise reach mortgage rates?"]},"Why do gilt yields matter to a family's mortgage? › What actually moves gilt yields?":{"text":["Expectations of Bank of England interest rates, expected inflation, how much the Government plans to borrow, and global moves in US and European bonds. The UK is a small share of world bond markets, so it often moves with everyone else.","A Government announcement can add a UK-specific premium if investors doubt the plan, which is the charge Badenoch was making. Whether a particular day's move was UK-specific or global is usually only clear afterwards."],"areas":[]},"Why do gilt yields matter to a family's mortgage? › How fast does a yield rise reach mortgage rates?":{"text":["Lenders price new fixed deals off swap rates, which follow gilt yields almost immediately. Big lenders can pull and reissue products within a day when markets move sharply, as happened in autumn 2022.","Existing fixed-rate borrowers feel nothing until their deal ends, which is why the pain of a rate shock spreads out over two or three years rather than landing at once."],"areas":[]},"What are the fiscal rules and who checks them?":{"text":["The rules are targets the Chancellor sets for borrowing and debt. In this session the Prime Minister stated two: no borrowing to fund day-to-day spending, and debt falling as a share of the economy by the end of the Parliament.","The Office for Budget Responsibility, an independent body, checks at each Budget whether the plans meet them, using its own forecasts. The Government cannot mark its own homework, which is the point. Breaking a rule is not illegal; it is a credibility hit that markets price."],"areas":["How much room is there against the rules?","Have the rules changed often?"]},"What are the fiscal rules and who checks them? › How much room is there against the rules?":{"text":["The gap between the forecast and the rule is called headroom. In recent years it has been small, often under ten billion pounds, which is tiny against a budget of over a trillion, so small forecast changes can wipe it out.","That is why unfunded promises alarm markets: with little headroom, new spending has to be matched by tax or cuts almost immediately."],"areas":[]},"What are the fiscal rules and who checks them? › Have the rules changed often?":{"text":["Yes. Britain has had a new set of fiscal rules roughly every few years since 1997, as Chancellors redefine debt, the target year, or what counts as investment.","Critics say that makes the rules a political prop; defenders say the constant is that some independent check exists, whatever the exact wording."],"areas":[]},"How big is the welfare bill compared with defence?":{"text":["Social security is the largest item of public spending, well over three hundred billion pounds a year including the state pension, which is more than half of it. Defence spending is a fraction of that, in the tens of billions.","So a small percentage saving in welfare is a large number in defence terms, which is why the argument keeps coming back. The counter is that the biggest slice, pensions, is politically untouchable, so cuts fall on working-age benefits and disability support."],"areas":["Which parts of welfare are actually growing?","What did Badenoch mean by debt interest doubling defence?"]},"How big is the welfare bill compared with defence? › Which parts of welfare are actually growing?":{"text":["The fastest growth in recent years has been in health-related benefits: disability payments and the health element of universal credit, driven by more claims for mental health conditions and long-term illness after the pandemic.","Pensions grow steadily because of the triple lock. Unemployment benefit itself is a small and shrinking part of the bill."],"areas":[]},"How big is the welfare bill compared with defence? › What did Badenoch mean by debt interest doubling defence?":{"text":["The Government pays interest on its accumulated debt. With debt near the size of the whole economy and rates higher than in the 2010s, interest has become one of the largest budget lines, comparable to or above the defence budget in recent years.","Her point was that money spent servicing old borrowing cannot be spent on soldiers, and that new borrowing makes that worse."],"areas":[]}},"2026-09-02:4":{"What does schedule 1 actually restrict?":{"text":["The Misuse of Drugs Regulations sort controlled drugs into five schedules by how freely they can be used in medicine. Schedule 1 is the tightest: the substance is judged to have no legitimate medical use, so possessing it even for research requires a Home Office licence.","Getting that licence takes months and costs thousands of pounds, and the site must meet secure storage rules designed for a pharmacy or a lab handling heroin. For a hospital wanting to run a small trial, that overhead is the barrier Smith described."],"areas":["What is in each schedule?","How long does a Home Office licence take?"]},"What does schedule 1 actually restrict? › What is in each schedule?":{"text":["Schedule 1 holds LSD, psilocybin, MDMA and raw cannabis. Schedule 2 covers strong medicines like morphine and cocaine, prescribable under strict records. Schedules 3 to 5 loosen the rules progressively down to low-strength codeine products.","Moving a drug from schedule 1 to 2 does not legalise it; it lets doctors and researchers handle it like other strong medicines."],"areas":[]},"What does schedule 1 actually restrict? › How long does a Home Office licence take?":{"text":["Researchers report waits of several months to over a year, plus fees and an inspection of the premises. Universities often need a separate licence for each site.","The Advisory Council on the Misuse of Drugs has itself said the barriers hold back legitimate research, which is the evidence Smith's amendments lean on."],"areas":[]},"What has the evidence on psilocybin therapy shown so far?":{"text":["Trials over the last decade, mostly small, have found that one or two doses of psilocybin given with psychological support can reduce symptoms of treatment-resistant depression for weeks or months. Results for end-of-life anxiety in cancer patients have been among the strongest.","The caveats are real: small numbers, difficulty blinding patients who obviously know they have taken a psychedelic, and uncertainty about how long benefits last. Regulators in several countries have granted breakthrough status but not routine approval."],"areas":["Why is it hard to run a proper trial?","Has any country approved psychedelic treatment?"]},"What has the evidence on psilocybin therapy shown so far? › Why is it hard to run a proper trial?":{"text":["A placebo-controlled trial depends on patients not knowing which arm they are in. With psychedelics the effect is unmistakable, so expectations can inflate results.","Trials also bundle the drug with hours of therapy, making it hard to separate what the chemical does from what the support does."],"areas":[]},"What has the evidence on psilocybin therapy shown so far? › Has any country approved psychedelic treatment?":{"text":["Australia allowed psychiatrists to prescribe psilocybin and MDMA for specific conditions from 2023, the first country to do so. Some US states and Canada have opened limited routes.","The UK has not, and any prescribing here would need both a licensing change and a medicines approval."],"areas":[]},"How did cannabis medicines get rescheduled in 2018?":{"text":["Two high-profile cases of children with severe epilepsy whose families were denied cannabis oil forced the issue. Within months the Home Secretary moved cannabis-based medicinal products from schedule 1 to schedule 2, allowing specialist doctors to prescribe them.","It is the precedent Smith's amendments rely on: a rescheduling that kept the drug controlled while opening a medical route. The sequel is also instructive, because NHS prescribing stayed rare for years afterwards."],"areas":["Why did NHS prescribing stay so rare?","Could the same route work for psilocybin?"]},"How did cannabis medicines get rescheduled in 2018? › Why did NHS prescribing stay so rare?":{"text":["Rescheduling allowed prescribing but did not settle the evidence. NHS guidance stayed cautious, most products lacked a full medicines licence, and clinicians were reluctant to prescribe without it.","Families ended up paying private clinics, which is the outcome campaigners warned about."],"areas":[]},"How did cannabis medicines get rescheduled in 2018? › Could the same route work for psilocybin?":{"text":["Supporters say yes: move it to schedule 2 so research and specialist use become practical, while keeping it controlled. Opponents worry about signalling and about diversion from clinics.","The Prime Minister's answer set the test as evidence and safeguards, which is also what the 2018 decision was justified on."],"areas":[]}},"2026-09-02:5":{"What would rejoining the single market actually require?":{"text":["In practice it means joining the European Economic Area, as Norway did, or a bespoke deal doing the same job. The UK would apply EU rules on goods, services and state aid without a vote on them, pay into EU programmes, and restore free movement of people.","Customs checks would not vanish unless the UK also rejoined the customs union, which is a separate step. Negotiating any of this would take years and the EU would set the terms."],"areas":["Is the single market the same as the customs union?","What would happen to free movement?"]},"What would rejoining the single market actually require? › Is the single market the same as the customs union?":{"text":["No. The single market is about common rules so goods and services can be sold anywhere inside it. The customs union is about a common tariff wall so goods cross internal borders without customs checks.","Norway is in the single market but not the customs union, so its lorries still face customs paperwork at the Swedish border. Turkey is in a customs union but not the single market."],"areas":[]},"What would rejoining the single market actually require? › What would happen to free movement?":{"text":["Single market membership comes with free movement of people: EU citizens could live and work in the UK without visas, and British citizens the same across the EU.","That was the central issue in 2016 and remains the reason the two largest parties rule membership out, whatever they say about trade."],"areas":[]},"How does the Norway model work?":{"text":["Norway, Iceland and Liechtenstein are in the European Economic Area. They adopt EU single market law as it is made, contribute to EU funds, and accept free movement, but stay outside the EU's agriculture, fisheries and customs policies and have no seat at the table.","Norwegians call it fax democracy: the rules arrive and they implement them. Supporters say the economic access is worth it; opponents say it is the worst of both worlds. It has survived decades because Norway's oil wealth cushions the trade-offs."],"areas":["Does Norway have any say over EU rules?","Why did Norway vote against joining the EU?"]},"How does the Norway model work? › Does Norway have any say over EU rules?":{"text":["Norwegian officials sit in expert groups that shape early drafts and Norway can in theory refuse a law, but the veto has effectively never been used because the EU could suspend the relevant part of the agreement in response.","In practice Norway takes what it is given and lobbies quietly."],"areas":[]},"How does the Norway model work? › Why did Norway vote against joining the EU?":{"text":["Norwegians rejected membership in referendums in 1972 and 1994, mainly over fisheries, farming and sovereignty. The EEA was the compromise that kept the economy inside the market.","Polls since have shown little appetite to revisit it, in either direction."],"areas":[]},"What is the EU's Made in Europe agenda?":{"text":["It is shorthand for a set of EU policies favouring goods produced inside the bloc: buy-European rules in public procurement, local content requirements for green industry, and support for European steel and battery makers.","Burnham's worry was that British steel, outside the EU, gets treated as foreign and loses orders it would once have won. That is why he named steel and farming as summit priorities rather than the single market: they are the sectors where the pain is concrete."],"areas":["Why is British steel exposed?","What is the UK-EU summit for?"]},"What is the EU's Made in Europe agenda? › Why is British steel exposed?":{"text":["British steelmaking is small, energy-intensive and already under pressure from high power prices and cheap imports. EU preference rules and its carbon border tax add barriers to its biggest export market.","Port Talbot's switch from blast furnaces to an electric arc furnace, mentioned later in the session, is part of the same story."],"areas":[]},"What is the EU's Made in Europe agenda? › What is the UK-EU summit for?":{"text":["Regular UK-EU summits were agreed in 2025 as the forum for improving the post-Brexit relationship in steps: food standards, energy, youth mobility, defence cooperation.","Each summit produces a package rather than a grand bargain, which suits both sides politically."],"areas":[]}},"2026-09-02:6":{"Why are there not enough midwives?":{"text":["England has been short of midwives for years, by several thousand on the NHS's own estimates. Training places were expanded, but many newly qualified midwives leave within a few years, citing workload, understaffed shifts and the stress of working in units they consider unsafe.","Rural and coastal units struggle most because they cannot offer the variety and career progression of a big city hospital, so a handful of vacancies can close a unit that a large hospital would absorb."],"areas":["Why do midwives leave the profession?","What is being done to recruit more?"]},"Why are there not enough midwives? › Why do midwives leave the profession?":{"text":["Surveys point to the same causes: short-staffed shifts, fear of being blamed when things go wrong, and pay that lags other graduate jobs. Many move to agency work for flexibility rather than leaving entirely.","Inquiries into maternity scandals have added scrutiny without always adding staff, which some midwives describe as the worst of both."],"areas":[]},"Why are there not enough midwives? › What is being done to recruit more?":{"text":["The NHS long-term workforce plan set targets to expand midwifery training substantially by the 2030s, alongside international recruitment and retention schemes.","Training takes three years, so any expansion announced now helps at the end of the decade, not next winter."],"areas":[]},"Who decides when a maternity unit closes?":{"text":["Temporary closures, sometimes called diverts, are decided by the hospital trust, usually by the head of midwifery and the on-call manager, when there are not enough staff on shift to run the unit safely. They can last hours or, as in North Devon's case, weeks.","Permanent closures or downgrades need consultation and the sign-off of the local integrated care board, and often end up with the Health Secretary. That is why a Prime Minister can promise to reopen a unit but cannot honestly promise a date: the staffing decision is made ward by ward."],"areas":["What is a maternity divert?","Can ministers overrule a trust?"]},"Who decides when a maternity unit closes? › What is a maternity divert?":{"text":["A divert tells ambulances and women in labour to go to another hospital because the unit cannot safely take them. Trusts must report diverts, and frequent ones are a warning sign regulators look for.","For a rural unit, a divert can mean an hour or more of travel, which is the situation Davey described."],"areas":[]},"Who decides when a maternity unit closes? › Can ministers overrule a trust?":{"text":["On a permanent change, yes: the Health Secretary can call in a proposal after local scrutiny. On a temporary safety closure, no minister will order a unit to open with too few staff, because the liability if something goes wrong is unanswerable.","Ministers can, however, push money and locum staff at a unit, which is what reopening in weeks rather than months usually means in practice."],"areas":[]},"Is giving birth in a bigger unit safer?":{"text":["For complicated births, the evidence favours larger units with round-the-clock consultants and a neonatal unit on site. For low-risk births, midwife-led units and home births have similar outcomes for babies and fewer interventions for mothers.","The catch is distance. Safety gains from centralising are lost if the journey is long enough that women give birth on the way, and inquiries have warned about exactly that in rural areas. So both Davey and Burnham can cite safety and mean different things."],"areas":["What did the maternity inquiries recommend?","How far is too far to travel in labour?"]},"Is giving birth in a bigger unit safer? › What did the maternity inquiries recommend?":{"text":["The Ockenden and East Kent reviews found poor culture, staff shortages and failures to listen to women behind avoidable deaths. They called for safe staffing levels, better training, and honesty when things go wrong.","Neither recommended closing small units outright; both said units must be staffed to their risk level."],"areas":[]},"Is giving birth in a bigger unit safer? › How far is too far to travel in labour?":{"text":["There is no fixed rule, but planners often treat forty-five minutes to an hour as the outer limit for a consultant unit. Beyond that, the risk of birth before arrival rises.","North Devon's two-hour journeys are well past that, which is why the case landed at PMQs."],"areas":[]}},"2026-09-02:7":{"How does power-sharing at Stormont work?":{"text":["The 1998 agreement built a system where unionists and nationalists must govern together. Members of the Assembly designate as unionist, nationalist or other, the largest parties on each side nominate the First and deputy First Ministers, and key votes need support from both communities.","Either of the two largest parties can refuse to nominate, which stops the Executive from forming. That guarantee was the price of peace, and it is also the mechanism that lets one party bring down the whole government."],"areas":["What is cross-community voting?","What does the First Minister actually do?"]},"How does power-sharing at Stormont work? › What is cross-community voting?":{"text":["Certain decisions need a majority of both unionist and nationalist members, not just a majority overall. Any thirty members can trigger this by lodging a petition of concern.","Designed to stop one community outvoting the other, the petition has also been used to block ordinary policy, which is one of the reforms Alliance has pushed."],"areas":[]},"How does power-sharing at Stormont work? › What does the First Minister actually do?":{"text":["The First Minister and deputy First Minister are joint heads of the Executive with equal powers despite the titles. Neither can act without the other, and if one resigns both offices fall.","That joint office is why a single party's walkout collapses the whole Executive."],"areas":[]},"Why does the Assembly keep collapsing?":{"text":["It fell in 2017 over a green energy scandal and did not return for three years. It fell again in 2022 when the DUP walked out over post-Brexit trade rules and stayed down for two years. Each time civil servants ran departments on emergency powers and the budget slipped.","The pattern is that any grievance can be turned into a veto. Eastwood's argument is that Northern Ireland cannot have stable finances while its government can be switched off by one party."],"areas":["What happens to public services during a collapse?","What was the Windsor Framework?"]},"Why does the Assembly keep collapsing? › What happens to public services during a collapse?":{"text":["Civil servants keep departments running but cannot take new policy decisions, so waiting lists, pay deals and reforms freeze. Westminster passes emergency budgets to keep money flowing.","By the time an Executive returns it inherits the backlog, which is why Northern Ireland's health waiting times are the worst in the UK."],"areas":[]},"Why does the Assembly keep collapsing? › What was the Windsor Framework?":{"text":["The 2023 deal between the UK and EU that eased checks on goods moving from Great Britain to Northern Ireland, which had been the DUP's reason for boycotting Stormont.","It got the Assembly back in 2024, but the underlying tension over Northern Ireland following some EU rules remains."],"areas":[]},"What does Alliance want to change?":{"text":["Alliance proposes ending mandatory designation as unionist or nationalist, replacing the two-community veto with a weighted majority of around two-thirds, and stopping a single party from blocking the formation of an Executive.","The larger parties resist because the vetoes protect their communities. Unionists fear being outvoted as demographics shift; nationalists fear losing a guaranteed share of power. Burnham's answer put reform after the budget, which is the sequence London has always preferred."],"areas":["Why do unionists and nationalists resist reform?","Has reform been tried before?"]},"What does Alliance want to change? › Why do unionists and nationalists resist reform?":{"text":["For unionists, the veto is insurance against a nationalist majority. For nationalists, it guarantees they cannot be governed without consent, as happened for fifty years before 1972.","Both see reform proposals as removing their safety net, even when they agree the system is dysfunctional."],"areas":[]},"What does Alliance want to change? › Has reform been tried before?":{"text":["Smaller changes have been made, such as limits on the petition of concern in 2020 and longer grace periods before an election is forced.","Wholesale change needs the agreement of the big parties and the two governments, and that agreement has never been there."],"areas":[]}},"2026-09-02:9":{"What is green belt land actually like?":{"text":["Green belt was created after the war to stop cities sprawling into each other, and it now rings most large English cities. It is not a quality designation: much of it is intensively farmed land, golf courses, scrubby fields by motorways, and some genuinely lovely countryside.","That mixture is why the argument is so sharp. Campaigners defend it as the countryside; developers point at petrol stations and car parks inside it. Recent policy has tried to split the difference with a grey belt category for the poorer-quality bits."],"areas":["What is grey belt?","How much of England is green belt?"]},"What is green belt land actually like? › What is grey belt?":{"text":["Grey belt is a newer planning term for green belt land that does little to serve the belt's purposes: previously developed sites, land hemmed in by roads or buildings, low-value scrub.","Councils are expected to release grey belt for homes before touching better land, with conditions on affordable housing and infrastructure attached."],"areas":[]},"What is green belt land actually like? › How much of England is green belt?":{"text":["Around an eighth of England's land area, more than all its towns and cities combined. It has barely shrunk in decades despite constant pressure.","Because it sits exactly where demand for homes is highest, on the edge of cities, small releases matter more than the percentage suggests."],"areas":[]},"How are council housing targets calculated?":{"text":["The standard method starts from the number of existing homes in an area and adds an uplift where prices are high relative to local incomes. The result is a yearly number each council is expected to plan for, and councils without an up-to-date plan lose control over where development goes.","When the formula was changed in 2024 to push more building into rural and suburban areas rather than city centres, some councils saw their numbers jump sharply. That is the 85% rise Thomas was quoting for his constituency."],"areas":["What happens if a council misses its target?","Why did the formula change in 2024?"]},"How are council housing targets calculated? › What happens if a council misses its target?":{"text":["A council that cannot show enough land supply or falls behind on delivery loses the presumption against development, so appeals by developers are more likely to succeed and homes go where the developer chooses.","Councils call this planning by appeal; ministers call it the consequence of not planning."],"areas":[]},"How are council housing targets calculated? › Why did the formula change in 2024?":{"text":["The old method concentrated targets in big cities, some of which were already building fast, and let expensive suburbs and shires off lightly. The new one weights affordability more heavily, which moves targets to where homes cost most.","That is popular in cities and unpopular in the areas whose MPs stood up at PMQs."],"areas":[]},"Is there enough brownfield land to hit the targets?":{"text":["Registers of brownfield sites suggest room for something over a million homes nationally, which sounds a lot but is a few years of the target, and much of it is in the wrong place, is contaminated, or is owned by people not in a hurry to sell.","So brownfield first is sound as a priority and insufficient as a plan. The Prime Minister's mention of releasing public land, such as old hospital and railway sites, is the usual next step before green belt is touched."],"areas":["Why is brownfield land expensive to build on?","What public land could be released?"]},"Is there enough brownfield land to hit the targets? › Why is brownfield land expensive to build on?":{"text":["Old industrial sites often need decontamination, demolition and new utilities before a single home goes up, and they tend to be small and awkwardly shaped, which suits flats more than family houses.","Developers therefore prefer green fields unless grants or planning pressure tip the balance."],"areas":[]},"Is there enough brownfield land to hit the targets? › What public land could be released?":{"text":["The NHS, Ministry of Defence, Network Rail and councils hold large amounts of surplus land: closed hospitals, old depots, disused sidings. Governments have promised to release it for decades with patchy results.","The obstacle is usually that the owning body wants full market value, which slows sales and pushes up prices."],"areas":[]}},"2026-09-02:11":{"What did the Thomas Commission recommend?":{"text":["The Commission on Justice in Wales, chaired by Lord Thomas, reported in 2019 that Wales should have full responsibility for justice, including policing, prisons, probation and the courts, arguing that split control between Cardiff and London produced worse outcomes and confused accountability.","The UK Government did not act on it. Devolving policing alone is the smaller step Plaid and some Welsh Labour figures have pushed since, on the grounds that it is the piece most easily separated from the courts."],"areas":["Why did Westminster say no?","What would change day to day if policing were devolved?"]},"What did the Thomas Commission recommend? › Why did Westminster say no?":{"text":["Ministers argued that England and Wales share a single legal jurisdiction and that splitting it would be costly and complex, and that Welsh forces benefit from national arrangements such as counter-terrorism.","Behind that, no UK government of either party has been keen to hand more powers to a Senedd it does not control."],"areas":[]},"What did the Thomas Commission recommend? › What would change day to day if policing were devolved?":{"text":["Funding, priorities and the appointment of chief constables would answer to Cardiff instead of the Home Office. Police and crime commissioners might be replaced or reshaped.","Officers on the street would notice little at first; the change is in who sets the strategy and who is blamed when it fails."],"areas":[]},"How does devolved policing work in Scotland?":{"text":["Policing in Scotland has been devolved since 1999, and in 2013 eight regional forces were merged into Police Scotland, answering to Scottish ministers and a national authority rather than the Home Office.","The merger cut back-office costs but was criticised for centralising decisions and weakening local links. Wales would not have to merge its four forces to devolve them, but the Scottish example is used by both sides: proof that devolution works, and a warning about what a national government might do with it."],"areas":["Was the single Scottish force a success?","How is Police Scotland funded?"]},"How does devolved policing work in Scotland? › Was the single Scottish force a success?":{"text":["Financially, savings were made after a rough transition. Operationally, early years saw rows over armed officers on routine patrol and stop-and-search rates, and an inspectorate criticised over-centralisation.","A decade on, most assessments call it stable but still short of the local accountability it replaced."],"areas":[]},"How does devolved policing work in Scotland? › How is Police Scotland funded?":{"text":["From the Scottish Government's block grant, which comes from the Treasury under the Barnett formula. Scotland decides how much of that block to spend on policing.","Devolving Welsh policing would mean moving the police grant into the Welsh block in the same way."],"areas":[]},"What powers does the Senedd already have?":{"text":["The Senedd legislates on health, education, local government, housing, transport, agriculture, the environment and, since 2018, some taxes including a share of income tax. Justice, policing, defence, welfare and most of the economy stay with Westminster.","Wales moved to a reserved powers model in 2017, meaning it can act on anything not explicitly reserved, the same footing as Scotland. Policing is on the reserved list, which is why an Act of the UK Parliament is needed to change it."],"areas":["What is the reserved powers model?","Which taxes does Wales control?"]},"What powers does the Senedd already have? › What is the reserved powers model?":{"text":["Instead of listing what the Senedd may do, the law lists what it may not, and everything else is devolved. It replaced a system where Wales had to check each power was granted.","The reserved list is long, and policing, justice and broadcasting are the ones most often argued over."],"areas":[]},"What powers does the Senedd already have? › Which taxes does Wales control?":{"text":["Land transaction tax, which replaced stamp duty on property, landfill disposals tax, and Welsh rates of income tax, where the Senedd can vary each band by ten pence in the pound. It has not yet used that power.","The bulk of Welsh spending still comes from the block grant."],"areas":[]}},"2026-09-02:12":{"How much is 3% of GDP in pounds?":{"text":["The UK economy is worth roughly two and three-quarter trillion pounds a year, so one per cent of GDP is in the region of twenty-seven billion pounds, as of the mid-2020s. Three per cent on defence would therefore be somewhere over eighty billion a year.","Spending in the mid-2020s was around two and a half per cent on the NATO definition, so the move to three is roughly fifteen billion a year extra, growing with the economy. For scale, that is about the size of the entire policing budget for England and Wales."],"areas":["What counts as defence spending under the NATO definition?","Where could fifteen billion a year come from?"]},"How much is 3% of GDP in pounds? › What counts as defence spending under the NATO definition?":{"text":["NATO counts armed forces pay and pensions, equipment, operations, and some military-related spending elsewhere in government, such as intelligence and part of the nuclear programme.","Governments are often accused of stretching the definition to hit the target, which is why the number is watched by allies as much as by voters."],"areas":[]},"How much is 3% of GDP in pounds? › Where could fifteen billion a year come from?":{"text":["Borrowing, tax, or cuts elsewhere, which is the argument the Six was about. The 2025 rise to two and a half per cent was funded partly by cutting the aid budget.","Dhesi wanted the pathway set now; the Government's position was that the spending review would set it."],"areas":[]},"What does NATO expect members to spend?":{"text":["For a decade the benchmark was two per cent of GDP, which most members missed. Under pressure from the United States and after Russia's full invasion of Ukraine, allies agreed in 2025 to a far higher goal for the 2030s, split between core defence and wider security spending.","The UK has long been above the old floor and below the new one, which is why three per cent by a fixed date has become the test of seriousness in domestic debate."],"areas":["Why did the target rise so sharply?","Which countries spend the most?"]},"What does NATO expect members to spend? › Why did the target rise so sharply?":{"text":["Russia's war showed that European stockpiles were thin and industry could not replace them quickly. At the same time American leaders questioned whether the United States should keep underwriting European security.","Raising the target was partly military necessity and partly a way to keep Washington inside the alliance."],"areas":[]},"What does NATO expect members to spend? › Which countries spend the most?":{"text":["Poland and the Baltic states, closest to Russia, spend the highest shares of GDP, in some cases over four per cent. The United States is the largest in cash terms by far.","Britain sits in the upper middle of the table and has one of the few full-spectrum forces in Europe."],"areas":[]},"Where has UK defence money gone in recent years?":{"text":["A large slice goes on the nuclear deterrent, whose new submarines and warheads are among the most expensive projects in government. Equipment programmes have a long record of overruns, and the army has shrunk to its smallest size in two centuries while personnel costs stayed high.","Support for Ukraine added billions on top. The result is a budget that has risen in cash terms while the forces feel poorer, which is why both the questioner and the Prime Minister could agree on the number and still argue about the plan."],"areas":["How much does the nuclear deterrent cost?","Why do equipment programmes overrun?"]},"Where has UK defence money gone in recent years? › How much does the nuclear deterrent cost?":{"text":["Running the deterrent and building its replacement absorb a growing share of the equipment budget, with the new Dreadnought submarines costing tens of billions over their life.","Supporters call it the ultimate insurance; critics note it leaves less for ships, aircraft and troops."],"areas":[]},"Where has UK defence money gone in recent years? › Why do equipment programmes overrun?":{"text":["Changing requirements mid-project, optimistic early costings, a small number of suppliers, and the temptation to delay orders to balance a year's budget, which raises the total cost later.","Parliament's spending watchdog has made the same criticisms for decades."],"areas":[]}},"2026-09-02:13":{"How does the holiday-let business rates loophole work?":{"text":["A second home that is let to holidaymakers can be registered as a business rather than a dwelling. It then pays business rates instead of council tax, and because most such properties are small, they qualify for small business rate relief, which can bring the bill to nothing.","The rules were tightened in 2023 so a property must actually be available and let for minimum numbers of days, but the basic route remains. George's half a billion figure is the estimated relief handed out in Cornwall over a decade."],"areas":["What are the letting thresholds since 2023?","Why is Cornwall so affected?"]},"How does the holiday-let business rates loophole work? › What are the letting thresholds since 2023?":{"text":["A property must be available to let for at least 140 nights and actually let for at least 70 nights in the year to count as a business in England, with similar rules in Wales.","Before 2023, simply advertising a property was enough, which is how empty second homes ended up paying nothing."],"areas":[]},"How does the holiday-let business rates loophole work? › Why is Cornwall so affected?":{"text":["Cornwall has one of the highest concentrations of second and holiday homes in England, in villages where they can be a third or more of the housing. Local wages are low and prices are set by buyers from elsewhere.","The county has become the test case for every second-home policy tried in England."],"areas":[]},"What can councils charge on second homes now?":{"text":["Since 2025 councils in England can charge double council tax on second homes, and long-empty homes can be charged up to four times. Wales allows premiums of up to 300% and many Welsh councils use them; Scotland also allows a double charge.","The premiums raise money and nudge some owners to sell or let long-term, but they only bite on homes classed as dwellings, which is why the business rates route matters so much."],"areas":["Do council tax premiums actually reduce second homes?","What has Wales done differently?"]},"What can councils charge on second homes now? › Do council tax premiums actually reduce second homes?":{"text":["Early evidence from Wales suggests some owners sell and some switch to holiday letting to escape the premium. Prices in a few hotspots have softened.","The clearest effect is on council income, which is why councils like them even where the housing effect is unproven."],"areas":[]},"What can councils charge on second homes now? › What has Wales done differently?":{"text":["Wales moved first and furthest: higher premiums, tougher letting thresholds, and a licensing scheme for holiday lets, with some councils able to require planning permission to change a home into a holiday let.","Plaid Cymru and Welsh Labour both claim credit, which is unusual."],"areas":[]},"What is a community land trust?":{"text":["A community land trust is a local not-for-profit that owns land and builds or buys homes on it, letting or selling them at prices tied to local incomes rather than the market. Because the trust keeps the land, the homes stay affordable when they change hands.","There are a few hundred in England, many in Cornwall and Devon, but they are small. George's Bill aims to give them easier access to land and finance, which is what he asked the Prime Minister to support."],"areas":["How do community land trusts keep homes affordable?","Why are there so few of them?"]},"What is a community land trust? › How do community land trusts keep homes affordable?":{"text":["A resale covenant fixes the price a home can be sold for, usually as a proportion of local earnings, so the first buyer's discount passes to the next buyer rather than becoming profit.","Rented homes are let at social or intermediate rents set by the trust."],"areas":[]},"What is a community land trust? › Why are there so few of them?":{"text":["Land is expensive, volunteers run out of energy, and lenders are wary of unusual structures. Most schemes deliver a dozen homes after years of work.","Supporters want public land offered to trusts first and a national fund to cover early costs."],"areas":[]}},"2026-09-02:15":{"What counts as NEET and how many young people are?":{"text":["NEET covers 16 to 24-year-olds who are neither in education, employment nor training. Around one in eight young people were NEET in the mid-2020s, close to a million, the highest for a decade, with the rise driven by young men and by those reporting long-term ill health.","The figure is contested in detail. Some are between jobs, some are caring for relatives, and a growing share say a mental health condition stops them working. Which of those you emphasise decides whether you think the answer is jobs, support or health services."],"areas":["Why has youth inactivity risen since the pandemic?","How does the UK compare with other countries?"]},"What counts as NEET and how many young people are? › Why has youth inactivity risen since the pandemic?":{"text":["Disrupted schooling and apprenticeships, a rise in reported mental ill health, and a weak entry-level jobs market for those without qualifications. Young people with no GCSE passes are far more likely to be NEET.","Economists disagree on how much is illness and how much is the labour market, which is exactly the Kruger and Burnham split."],"areas":[]},"What counts as NEET and how many young people are? › How does the UK compare with other countries?":{"text":["The UK's youth NEET rate is around the middle of rich countries, better than southern Europe, worse than Germany or the Netherlands where apprenticeship systems are stronger.","Britain is unusual in how much of its rise is attributed to health rather than unemployment."],"areas":[]},"What is a T-level placement?":{"text":["T-levels are two-year technical courses for 16 to 19-year-olds, launched in 2020 as the vocational equivalent of A-levels, in subjects like construction, health and digital. Each includes an industry placement of around 45 days with a real employer.","Finding enough placements has been the programme's biggest problem, especially outside big cities. Burnham's claim was that Greater Manchester expanded placements by working with employers, and that this is the kind of support that gets young people into work."],"areas":["Why are placements hard to find?","Are T-levels working?"]},"What is a T-level placement? › Why are placements hard to find?":{"text":["Small employers lack the time to supervise a student for nine weeks, and some sectors have safety or confidentiality rules that make it awkward. Colleges compete for the same firms.","Regional bodies like combined authorities can broker placements at scale, which is the Manchester model."],"areas":[]},"What is a T-level placement? › Are T-levels working?":{"text":["Take-up has grown slowly and dropout rates were high in early cohorts. Employers who host students tend to praise them; students report the courses are demanding.","Reviews have suggested keeping T-levels but stopping the removal of older qualifications until they are established."],"areas":[]},"Do lower business taxes create jobs for young people?":{"text":["Cutting taxes on employment, such as employer national insurance, does tend to raise hiring at the margin, and young and low-paid workers are the most sensitive to it. Cutting corporation tax has a weaker and slower link to jobs, since firms may bank the saving or invest in machinery instead.","The evidence on conditions, making benefits depend on job search or work, is that they raise the number in work and also push some people out of the system entirely. That is the trade-off behind Kruger's phrase that those who can work should be working."],"areas":["Which taxes affect hiring most?","What happened when benefit conditions were tightened before?"]},"Do lower business taxes create jobs for young people? › Which taxes affect hiring most?":{"text":["Employer national insurance is a direct cost per worker, so changes to it move hiring decisions quickly. The threshold at which it starts matters most for part-time and young workers.","Business rates affect where firms locate more than how many they employ."],"areas":[]},"Do lower business taxes create jobs for young people? › What happened when benefit conditions were tightened before?":{"text":["The 2010s saw tougher sanctions and job-search rules. Employment rose, but studies found sanctions pushed some claimants into hardship rather than work, and many left the benefit system without a job.","Both sides of the Commons cite that period as evidence for their view."],"areas":[]}},"2026-09-02:17":{"What does the Office for Budget Responsibility do?":{"text":["The OBR was created in 2010 to take economic forecasting out of the Treasury's hands. Twice a year it produces independent forecasts of growth, borrowing and debt, and judges whether the Government's plans meet its own fiscal rules.","It does not set policy or tell the Chancellor what to do. Its power is that a Budget without an OBR forecast, as in 2022, is treated by markets as a Budget nobody has checked."],"areas":["Who runs the OBR and who appoints them?","How accurate are its forecasts?"]},"What does the Office for Budget Responsibility do? › Who runs the OBR and who appoints them?":{"text":["A three-person committee led by a chair appointed by the Chancellor with the approval of the Commons Treasury Committee, which gives Parliament a veto over the appointment.","Staff are civil servants but the committee's judgements are its own."],"areas":[]},"What does the Office for Budget Responsibility do? › How accurate are its forecasts?":{"text":["About as accurate as anyone else's, which is to say wrong in detail and roughly right in direction. It publishes its own errors each year.","Its value is independence rather than accuracy: nobody accuses it of shading numbers to suit the Government."],"areas":[]},"What counts as investment under the rules?":{"text":["The rule against borrowing for day-to-day spending draws a line between current spending, such as wages and benefits, and capital spending on things that last, such as roads, hospitals and equipment. Borrowing for the second is allowed.","Where the line falls is the argument. Is training nurses investment? Is a defence stockpile? Governments have redefined debt and investment to make room, which is the flexibility Rankin was probing and the Prime Minister was ruling out."],"areas":["Why does the current versus capital split matter?","How was debt redefined in 2024?"]},"What counts as investment under the rules? › Why does the current versus capital split matter?":{"text":["Borrowing to build an asset leaves the country with something to show for it; borrowing to pay this year's bills does not. Markets and the OBR treat the two differently for that reason.","The temptation is to relabel current spending as capital, which watchdogs police."],"areas":[]},"What counts as investment under the rules? › How was debt redefined in 2024?":{"text":["The debt target was switched to a measure that nets off the value of public assets and loans, which freed tens of billions of borrowing room for investment.","Supporters called it sensible accounting; critics called it moving the goalposts."],"areas":[]},"What happened when the rules were broken in 2022?":{"text":["In September 2022 a new Government announced large unfunded tax cuts without an OBR forecast. Gilt yields jumped, the pound fell, and pension funds that had bet on stable yields faced forced selling, which the Bank of England had to stop with emergency purchases.","Most of the tax cuts were reversed within weeks and the Prime Minister resigned. The episode is why both sides at PMQs now compete to sound the most fiscally cautious, and why Badenoch's past praise of it was raised in the Six."],"areas":["Why did pension funds nearly collapse?","How much did mortgage rates rise?"]},"What happened when the rules were broken in 2022? › Why did pension funds nearly collapse?":{"text":["Many funds used a strategy called liability-driven investment that borrowed against gilts. When gilt prices fell sharply they had to post cash, sold gilts to raise it, and pushed prices down further in a loop.","The Bank's intervention broke the loop; the strategy has since been reined in."],"areas":[]},"What happened when the rules were broken in 2022? › How much did mortgage rates rise?":{"text":["Typical two-year fixed rates went from around four per cent to over six within weeks, and lenders withdrew hundreds of products overnight.","Rates eased as the policies were reversed but never returned to pre-2022 levels, partly because the Bank of England was raising its own rate anyway."],"areas":[]}},"2026-09-02:18":{"Why do disposable barbecues start moorland fires?":{"text":["A disposable barbecue is a foil tray of charcoal that stays hot for hours after cooking. Placed on dry grass or peat, it can ignite the surface directly, and if abandoned or buried the embers can smoulder unseen and flare up later.","Moorland peat is the problem: once alight it burns downward and can smoulder for weeks, releasing stored carbon and destroying habitat that took centuries to form. Several of the largest recent English wildfires were traced to barbecues or campfires."],"areas":["Why does peat burn for so long?","Which retailers stopped selling them?"]},"Why do disposable barbecues start moorland fires? › Why does peat burn for so long?":{"text":["Peat is partly decomposed plant material, essentially a fuel. In a dry summer the top layer dries out and a fire can burn down into it, sheltered from rain and firefighters' water.","Putting a peat fire out can mean flooding the ground for days."],"areas":[]},"Why do disposable barbecues start moorland fires? › Which retailers stopped selling them?":{"text":["Several supermarkets and DIY chains withdrew disposable barbecues from stores near national parks or altogether from 2022, and some councils banned them in parks with local orders.","A national ban, temporary or permanent, would make those voluntary steps universal."],"areas":[]},"What are fire services legally required to do?":{"text":["Fire and rescue services in England have statutory duties to fight fires, respond to road traffic collisions, and prepare for emergencies. Flooding, despite being one of the most common call-outs, is not a statutory duty in England, unlike in Scotland and Wales.","Wildfire is covered under firefighting, but the equipment and training are geared to buildings. The Prime Minister's point was that a service built for house fires is being asked to fight a landscape, and it lacks the aircraft and vehicles that job needs."],"areas":["Why is flooding not a statutory duty in England?","How are fire services funded?"]},"What are fire services legally required to do? › Why is flooding not a statutory duty in England?":{"text":["It was left out of the 2004 Act that defined the modern service, and successive reviews recommended adding it without ministers acting. Services attend floods anyway, but without guaranteed funding or equipment for it.","Making it statutory would come with a bill."],"areas":[]},"What are fire services legally required to do? › How are fire services funded?":{"text":["Through a mix of central government grant and council tax, controlled by fire authorities or, in some areas, the police and crime commissioner or mayor. Budgets fell in real terms through the 2010s and firefighter numbers dropped by roughly a fifth.","That is the backdrop to the summit Burnham promised."],"areas":[]},"How do France and Italy fight wildfires?":{"text":["Mediterranean countries have decades of experience and treat wildfire as a national civil protection task. France runs a fleet of water-bombing aircraft and helicopters, pre-positions crews in high-risk weeks, and uses military and volunteer units alongside firefighters.","Italy similarly combines a national aircraft fleet with regional forces. Britain has nothing comparable: the odd helicopter is hired ad hoc, which is the gap the Prime Minister referred to and the summit is meant to address."],"areas":["Would water-bombing aircraft work in Britain?","What does the EU do jointly on wildfires?"]},"How do France and Italy fight wildfires? › Would water-bombing aircraft work in Britain?":{"text":["Helicopters with water buckets are effective on moorland and can be shared between regions. Large fixed-wing water bombers need lakes or coastlines to scoop from and are expensive to keep for a season that is short in Britain.","The usual proposal is a small national helicopter capability rather than a French-style fleet."],"areas":[]},"How do France and Italy fight wildfires? › What does the EU do jointly on wildfires?":{"text":["The EU's civil protection mechanism pools aircraft that member states can call on when their own capacity is overwhelmed, funded centrally and stationed in the highest-risk countries.","The UK left that arrangement with Brexit, though it can still request help through it in an emergency."],"areas":[]}},"2026-09-02:19":{"What is floating offshore wind?":{"text":["Conventional offshore turbines stand on foundations fixed to the seabed, which limits them to shallow water. Floating turbines sit on moored platforms and can be placed in deep water far from shore, where winds are stronger and steadier.","Much of the ScotWind leasing round is floating because Scotland's best wind is over deep water. The technology works but is still expensive and mostly unproven at scale, so projects depend on grid connections and guaranteed prices for their power to get built."],"areas":["Why is floating wind more expensive?","Where is floating wind already working?"]},"What is floating offshore wind? › Why is floating wind more expensive?":{"text":["The floating platforms, mooring lines and dynamic cables are all extra hardware, and the supply chain to build them at scale barely exists yet. Costs are expected to fall as they did for fixed offshore wind, but that took a decade.","Until then, projects need higher guaranteed prices than fixed wind, which is what the pathway choice decides."],"areas":[]},"What is floating offshore wind? › Where is floating wind already working?":{"text":["Small pilot farms off Scotland, Norway and Portugal have run for years, proving the engineering. The first commercial-scale farms are being planned in Scotland, the Celtic Sea and off California.","Scotland's early lead is what Logan wanted the energy plan to protect."],"areas":[]},"What is the strategic spatial energy plan?":{"text":["The plan is a map of where Britain's electricity generation, storage and grid should be built over the next twenty-five years, drawn up by the National Energy System Operator for the Government. Instead of developers choosing sites and then waiting years for a grid connection, the plan decides zones first.","The system operator modelled several pathways with different mixes of wind, solar, nuclear and where they go. Logan's fear was that a pathway with less Scottish wind would strand ScotWind leases without a grid, which is why he wanted the Prime Minister to commit."],"areas":["Who is the National Energy System Operator?","What is the grid connection queue?"]},"What is the strategic spatial energy plan? › Who is the National Energy System Operator?":{"text":["A publicly owned body created in 2024 to run the electricity system and plan the gas and power networks, taking over from the part of National Grid that used to do it.","It advises ministers, who make the final choices, which is why the Energy Secretary picks the pathway."],"areas":[]},"What is the strategic spatial ene
