 policing. If we let small things go, bigger things come along"}]},{"id":"2026-09-02:11","kind":"fight","q":39,"a":40,"theme":"Devolution","title":"Should policing be devolved to Wales?","summary":"Saville-Roberts said the PM agrees that devolving powers means better services, yet policing in Wales is still run from Westminster, and asked him to put it on the table with the First Minister. Burnham said proposals from the Senedd Government would get fair consideration and he was ready to work on more devolved power, without committing to policing.","decided":"Whether to hand control of policing to the Welsh Government, as it is in Scotland and Northern Ireland.","quotes":[{"i":39,"text":"policing in Wales is still controlled from afar here in Westminster"},{"i":40,"text":"where proposals come from the Senedd Government, we will give them fair consideration"}],"sides":{"a":{"label":"Devolve policing to Wales","points":[{"text":"The Plaid Cymru Government in Wales has shown what can be done with the powers it has.","i":39},{"text":"The PM himself says devolving powers means better public services.","i":39},{"text":"Policing is the obvious next power, and it should be on the table at next month's meeting.","i":39}]},"b":{"label":"Consider Senedd proposals case by case","points":[{"text":"Proposals from the Senedd Government will get fair consideration.","i":40},{"text":"The priority is growth and securing the future of Port Talbot together.","i":40},{"text":"He is ready to work with Plaid on more local power if it helps those goals.","i":40}]}},"learn":{"background":["Policing is devolved in Scotland and Northern Ireland but not in Wales, where the four forces answer to the Home Office and to elected police and crime commissioners. Wales has had its own government since 1999, so policing is one of the last big domestic services still run from London.","Two independent reviews, the Silk Commission and the Thomas Commission, recommended devolving policing and parts of justice to Wales. Westminster governments of both parties have declined, partly because the criminal courts and prisons would be hard to split from England.","Burnham's answer was warm on devolution in general and silent on policing in particular. Fair consideration of Senedd proposals is not a no, but with Port Talbot and growth named as the priorities, it was not a yes either."],"areas":["What did the Thomas Commission recommend?","How does devolved policing work in Scotland?","What powers does the Senedd already have?"]},"frame":{"a":"Saville-Roberts's case","b":"Burnham's reply"},"stance":true},{"id":"2026-09-02:12","kind":"agreed","q":41,"a":42,"theme":"Defence","title":"Should Britain commit to 3% of GDP on defence by 2030?","summary":"Dhesi said the threat from Russia is up and the US no longer prioritises European security, so the PM should commit now to a pathway to 3% of GDP on defence by 2030 rather than wait for a fiscal event. Burnham said he had made that commitment clearly and for some time, and repeated it in Ukraine last week.","decided":"Whether to commit now to 3% of GDP on defence by 2030, ahead of the spending review.","quotes":[{"i":41,"text":"defence is definitely one area where vibes alone just will not be enough"},{"i":42,"text":"I have made that commitment, I have made it very clearly, and I have done so for a considerable time."}],"sides":{"a":{"label":"Commit now to 3% by 2030","points":[{"text":"The threat level, especially from Russia, has significantly increased.","i":41},{"text":"US leadership no longer treats European security as a priority.","i":41},{"text":"Waiting for a future fiscal event is kicking the can down the road.","i":41}]},"b":{"label":"Set the path at the spending review","party":null,"points":[]}},"learn":{"background":["Defence spending is usually measured as a share of the whole economy, GDP, because that is how NATO sets its targets. The UK has met the old 2% floor for years; the argument now is how fast to get to a much higher figure agreed by NATO allies as the threat from Russia has grown.","Moving from around 2.5% to 3% sounds small but is tens of billions of pounds a year, which is why it collides with the welfare and borrowing argument earlier in the session. Where the money comes from is the real fight, not the number.","Dhesi and Burnham agreed on the number. Badenoch's version of the same demand, in the Six, was that welfare should be cut to pay for it immediately. Nobody in the chamber argued for staying below 3%, so the other side of this stance was not put by anyone."],"areas":["How much is 3% of GDP in pounds?","What does NATO expect members to spend?","Where has UK defence money gone in recent years?"]},"frame":{"a":"Dhesi's push","b":"The other side"},"stance":true},{"id":"2026-09-02:13","kind":"agreed","q":43,"a":44,"theme":"Housing","title":"Should second-home tax breaks go to fund local housing?","summary":"George said more than half a billion pounds of taxpayers' money has gone to second-home owners in Cornwall through tax loopholes while local housing got worse, and asked the PM to back tools in his community-led homes Bill. Burnham agreed to a meeting with all Cornish MPs and to look at powers within a devolution deal for second homes.","decided":"Whether to close second-home tax loopholes and give communities power over housing in places like Cornwall.","quotes":[{"i":43,"text":"The planning system is fuelled by greed rather than need"},{"i":44,"text":"I will agree here and now to a meeting with him and all Cornish MPs"}],"sides":{"a":{"label":"Close the loopholes and empower communities","points":[{"text":"More than half a billion pounds went to second-home owners in Cornwall in a decade through tax loopholes.","i":43},{"text":"Local housing problems got significantly worse over the same period.","i":43},{"text":"His Bill would give communities tools to meet local need.","i":43}]},"b":{"label":"Leave second-home rules as they are","party":null,"points":[]}},"learn":{"background":["The loophole George meant is the one where a second home let out as a holiday property can be registered as a business, paying business rates instead of council tax and often qualifying for small business rate relief, which can mean paying nothing at all. The rules were tightened in 2023 to require real letting activity.","Councils in England can now charge a council tax premium on second homes, and Wales allows premiums of up to 300%. Cornwall has among the highest numbers of second homes in England, concentrated in coastal towns where locals are priced out.","Community-led housing means homes built or owned by a local trust rather than a developer, kept affordable in perpetuity. The Prime Minister did not commit to George's Bill but offered a meeting and hinted at powers in a Cornwall devolution deal."],"areas":["How does the holiday-let business rates loophole work?","What can councils charge on second homes now?","What is a community land trust?"]},"frame":{"a":"George's case","b":"The other side"},"stance":true},{"id":"2026-09-02:14","kind":"friendly","q":45,"a":46,"theme":"Other","title":"Dollimore asked that young people in Hastings get to see the Bayeux Tapestry","summary":"Dollimore welcomed the tapestry's return and asked the PM to press the British Museum to get as many young people from her area in as possible. Burnham said he would relay the message that evening and wants the maximum number of children to stand in front of it.","quotes":[{"i":46,"text":"They learn about it in school; they should be able to stand in front of it."}]},{"id":"2026-09-02:15","kind":"fight","q":47,"a":48,"theme":"Welfare","title":"Tax cuts or state support to get young people into work?","summary":"Kruger said youth employment got worse while the PM was Mayor of Greater Manchester and no amount of taxpayer-funded support will fix it, so the answer is business tax cuts and requiring those who can work to work. Burnham said young people who can work should be working, that the rise in NEETs was smaller in Greater Manchester than elsewhere, and that support like T-level placements and free bus passes is what connects them to work.","decided":"Whether to get young people into work mainly through business tax cuts and conditions, or through funded support and placements.","quotes":[{"i":47,"text":"no amount of taxpayer-funded support is going to fix that"},{"i":48,"text":"It is too hard growing up as it is at this moment in time"}],"sides":{"a":{"label":"Cut business taxes; expect those who can work to work","points":[{"text":"Youth employment did not improve while the PM was Mayor of Greater Manchester; it got worse.","i":47},{"text":"Taxpayer-funded support will not fix it.","i":47},{"text":"Meaningful tax cuts for businesses and an expectation to work are the way in.","i":47}]},"b":{"label":"Fund support and placements into work","points":[{"text":"Young people who can work should be working, and they want to.","i":48},{"text":"Greater Manchester expanded T-level work placements and gave 16 to 18-year-olds free bus travel.","i":48},{"text":"The rise in NEETs was not the same in Greater Manchester as elsewhere, so check the figures.","i":48}]}},"learn":{"background":["NEET means a young person not in education, employment or training. The number has been rising since the pandemic, and it is the statistic both sides were arguing about without saying it out loud: Kruger blamed the PM's record in Manchester, Burnham said Manchester did better than the national trend.","The two remedies are the two oldest in the book. One says employers hire when hiring is cheap, so cut their taxes and tighten benefit conditions. The other says young people need routes: technical courses, placements, and the bus fare to reach them.","T-levels are two-year technical qualifications for 16 to 19-year-olds that include a long industry placement, which is why placement availability is a bottleneck. Burnham's free bus pass claim is real policy from his time as Mayor."],"areas":["What counts as NEET and how many young people are?","What is a T-level placement?","Do lower business taxes create jobs for young people?"]},"frame":{"a":"Kruger's case","b":"Burnham's reply"},"stance":true},{"id":"2026-09-02:16","kind":"friendly","q":49,"a":50,"theme":"Health","title":"Yasin asked to restore in-patient mental health beds in Bedford","summary":"Yasin said Bedford lost its in-patient mental health services in 2017 and they were never replaced, and asked the PM to work with him on restoring them. Burnham said mental health services must do better and he would work with the Health Secretary on Bedford's case.","quotes":[{"i":50,"text":"We have to do better on mental health services, and the Health Secretary absolutely agrees."}]},{"id":"2026-09-02:17","kind":"agreed","q":51,"a":52,"theme":"Economy","title":"Should the Government stick to the fiscal rules whatever it costs?","summary":"Rankin said the PM had not answered the Leader of the Opposition on spending and that markets were anxious, and asked him to state the fiscal rules and say he would stick to them. Burnham answered in one sentence: no borrowing for day-to-day spending, debt falling as a share of GDP by the end of the Parliament, and yes.","decided":"Whether to treat the fiscal rules as fixed, even if that means cuts or tax rises to keep to them.","quotes":[{"i":51,"text":"Can he now, in front of this House, confirm what the fiscal rules are and categorically say that the Government will stick to them?"},{"i":52,"text":"No borrowing to fund day-to-day spending, debt falling as a percentage of GDP by the end of the Parliament, and yes, we will."}],"sides":{"a":{"label":"Keep the fiscal rules, whatever it takes","points":[{"text":"Markets were anxious over the summer when the PM did not spell out the rules.","i":51},{"text":"The capital markets have made their view of his plans clear.","i":51},{"text":"The PM should confirm the rules and commit to them in front of the House.","i":51}]},"b":{"label":"Loosen the rules to borrow for investment","party":null,"points":[]}},"learn":{"background":["Fiscal rules are targets a government sets itself for borrowing and debt, checked by the independent Office for Budget Responsibility at each Budget. They are not law. Their force comes from the cost of breaking them: lenders charge more if they think the rules are being bent.","The two Burnham stated are the standard pair. Day-to-day spending must be covered by tax, so borrowing is only for investment; and debt must be falling as a share of the economy by a fixed year. The detail that matters is which year, and what counts as investment.","Rankin and Burnham agreed on the rules. The argument was whether the promises made the day before could fit inside them. Nobody in the chamber argued for looser rules, so that side of this stance is unattributed."],"areas":["What does the Office for Budget Responsibility do?","What counts as investment under the rules?","What happened when the rules were broken in 2022?"]},"frame":{"a":"Rankin's challenge","b":"The other side"},"stance":true},{"id":"2026-09-02:18","kind":"agreed","q":53,"a":54,"theme":"Environment","title":"Should disposable barbecues be banned for good?","summary":"Pearce said his constituency suffered devastating wildfires this summer and asked what the PM would do to prepare for next year, including making the temporary ban on disposable barbecues permanent. Burnham said he would call a wildfire summit and that fire services lack modern equipment and aerial support, without confirming the permanent ban.","decided":"Whether to make the disposable barbecue ban permanent, and treat wildfires as a statutory job for fire services.","quotes":[{"i":53,"text":"we must face the fact that our climate is changing and communities such as mine are suffering the consequences"},{"i":54,"text":"Our fire and rescue services are not set up properly for the changing climate."}],"sides":{"a":{"label":"Ban disposable barbecues permanently","points":[{"text":"Communities suffered devastating wildfires this summer.","i":53},{"text":"The temporary ban helped and should be made permanent.","i":53},{"text":"The climate is changing and preparation for next summer must start now.","i":53}]},"b":{"label":"Keep the ban temporary","party":null,"points":[]}},"learn":{"background":["Disposable barbecues are foil trays of charcoal that stay hot for hours after use. They have been linked to moorland fires for years, and many retailers stopped selling them voluntarily before any government acted. A national temporary ban was the summer's response to fires on the edge of Greater Manchester and elsewhere.","Fire and rescue services in England have a legal duty to fight fires and deal with road crashes, but Burnham pointed out that flooding is not a statutory duty and that wildfire capability, including aircraft, lags behind southern Europe.","The Prime Minister promised a wildfire summit rather than the permanent ban Pearce asked for. Nobody in the chamber argued for keeping the ban temporary, so that side of this stance is unattributed."],"areas":["Why do disposable barbecues start moorland fires?","What are fire services legally required to do?","How do France and Italy fight wildfires?"]},"frame":{"a":"Pearce's ask","b":"The other side"},"stance":true},{"id":"2026-09-02:19","kind":"fight","q":55,"a":56,"theme":"Environment","title":"Should the energy plan commit to the full ScotWind pipeline?","summary":"Logan said the Energy Secretary is about to pick one of six pathways for the strategic spatial energy plan and that the wrong one could deny Scottish workers the ScotWind investment, and asked the PM to commit to a pathway that enables the full pipeline. Burnham said the transition must be pragmatic rather than ideological, that he would visit Aberdeen soon, and mentioned Grangemouth for sustainable aviation fuel, without committing to a pathway.","decided":"Whether to choose the energy pathway that backs all of ScotWind, or leave the choice to a system-wide plan.","quotes":[{"i":55,"text":"the wrong pathway could deny energy transition opportunities for our world-class, skilled and experienced Scottish energy workers and industries"},{"i":56,"text":"It must be done in a pragmatic way so that we can make the transition work rather than being too ideological about it"}],"sides":{"a":{"label":"Commit today to the full ScotWind pathway","points":[{"text":"ScotWind represents £78.5 billion of potential investment and more than 21,000 jobs.","i":55},{"text":"The GMB union has warned the wrong pathway would deny workers transition opportunities.","i":55},{"text":"Grangemouth and Ardersier show what happens when promises are not kept.","i":55}]},"b":{"label":"A pragmatic transition, no pathway commitment yet","points":[{"text":"Reindustrialising Scotland is exactly what he means by an industrial transition.","i":56},{"text":"It must be pragmatic rather than ideological, unlike other parties.","i":56},{"text":"He will visit Aberdeen soon and sees Grangemouth as a home for sustainable aviation fuel.","i":56}]}},"learn":{"background":["ScotWind is the round of seabed leases sold by Crown Estate Scotland in 2022 for offshore wind farms, much of it floating wind in deep water. The headline investment figure is what developers said they would spend if every project goes ahead, which depends on grid connections and on who buys the power.","The strategic spatial energy plan is the map of where Britain's generation and grid should be built over the next 25 years, drawn up by the National Energy System Operator. Choosing a pathway that assumes less Scottish wind would leave leases without a grid to plug into.","Grangemouth was Scotland's only oil refinery until it closed, and Ardersier is a port being rebuilt for offshore wind. Logan used both as examples of promises to workers that did not hold. Burnham offered a visit and a summit-style approach rather than the commitment asked for."],"areas":["What is floating offshore wind?","What is the strategic spatial energy plan?","What happened at Grangemouth?"]},"frame":{"a":"Logan's demand","b":"Burnham's reply"},"stance":false},{"id":"2026-09-02:20","kind":"friendly","q":58,"a":59,"theme":"Health","title":"Niblett asked the PM to back her campaign for lifelong sex education","summary":"In her first PMQs question, Niblett said shame about talking about sex and body parts is leading to late diagnoses of cancers, and asked the PM to meet her about her lifelong sex education campaign. Burnham agreed to meet, with a joke that drew laughter.","quotes":[{"i":59,"text":"it is clear to me that her summer was more exciting than mine"}]}]};
